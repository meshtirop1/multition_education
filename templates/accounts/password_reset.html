{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block hide_footer %}{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card" style="text-align:center">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1.2rem"><i class="fas fa-lock"></i></div>
    <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:0.5rem">Reset Password</h2>
    <p style="color:var(--text-secondary);font-size:0.88rem;margin-bottom:1.5rem">Enter your email to receive a reset link</p>
    <form method="post" style="text-align:left">{% csrf_token %}
        <div class="mb-3"><label class="form-label">Email Address</label><input type="email" name="email" class="form-control" required></div>
        {% if form.errors %}<div class="alert-custom alert-danger" style="font-size:0.85rem">{{ form.errors.email.0 }}</div>{% endif %}
        <button type="submit" class="btn-accent w-100" style="padding:0.7rem">Send Reset Link</button>
    </form>
    <p style="margin-top:1.2rem;font-size:0.88rem;color:var(--text-secondary)"><a href="{% url 'accounts:login' %}">Back to Login</a></p>
</div></div>
{% endblock %}
