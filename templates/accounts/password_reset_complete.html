{% extends 'base.html' %}
{% block title %}Password Reset{% endblock %}
{% block hide_footer %}{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card" style="text-align:center">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.12);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1.2rem"><i class="fas fa-check-circle"></i></div>
    <h2 style="font-family:var(--font-display);font-size:1.4rem;margin-bottom:0.5rem">Password Reset!</h2>
    <p style="color:var(--text-secondary);font-size:0.88rem">Your password has been set. You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn-accent" style="margin-top:1.2rem">Log In</a>
</div></div>
{% endblock %}
