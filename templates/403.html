{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;padding:4rem 1rem;text-align:center">
    <div style="font-size:5rem;font-weight:800;color:var(--accent);opacity:0.3;line-height:1">403</div>
    <h1 style="font-size:1.5rem;margin:1rem 0 0.5rem">Access Denied</h1>
    <p style="color:var(--text-muted);margin-bottom:2rem">You don't have permission to access this page.</p>
    <div style="display:flex;gap:1rem;justify-content:center">
        <a href="/" class="btn-accent"><i class="fas fa-home me-1"></i> Go Home</a>
        <a href="{% url 'accounts:login' %}" class="btn-outline-accent"><i class="fas fa-sign-in-alt me-1"></i> Log In</a>
    </div>
</div>
{% endblock %}
