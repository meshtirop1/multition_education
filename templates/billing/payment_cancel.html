{% extends 'base.html' %}
{% block title %}Payment Cancelled{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;padding:3rem 1rem;text-align:center">
    <div style="width:80px;height:80px;border-radius:50%;background:#fee2e2;color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem">
        <i class="fas fa-times"></i>
    </div>
    <h1 style="font-size:1.5rem;margin-bottom:0.5rem">Payment Cancelled</h1>
    <p style="color:var(--text-muted);margin-bottom:2rem">Your payment for <strong>{{ course.title }}</strong> was not completed.</p>
    <div style="display:flex;gap:1rem;justify-content:center">
        <a href="{% url 'billing:checkout' slug=course.slug %}" class="btn-accent"><i class="fas fa-redo me-1"></i> Try Again</a>
        <a href="{% url 'courses:detail' slug=course.slug %}" class="btn-outline-accent">Back to Course</a>
    </div>
</div>
{% endblock %}
