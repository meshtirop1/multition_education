{% extends 'base.html' %}
{% block title %}Payment Cancelled{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;padding:3rem 1rem;text-align:center">
    <div style="width:80px;height:80px;border-radius:50%;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem">
        <i class="fas fa-times"></i>
    </div>
    <h1 style="font-size:1.5rem;margin-bottom:0.5rem">Payment Cancelled</h1>
    <p style="color:var(--text-secondary);margin-bottom:2rem">No worries! You can try again whenever you're ready.</p>
    <a href="{% url 'payments:checkout' slug=course.slug %}" class="btn-accent" style="padding:0.7rem 2rem"><i class="fas fa-redo me-1"></i> Try Again</a>
    <div style="margin-top:1rem">
        <a href="{% url 'courses:detail' slug=course.slug %}" style="font-size:0.85rem;color:var(--text-muted)">Back to course</a>
    </div>
</div>
{% endblock %}
