{% extends 'base.html' %}
{% block title %}Payment Successful{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;padding:3rem 1rem;text-align:center">
    <div style="width:80px;height:80px;border-radius:50%;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem">
        <i class="fas fa-check"></i>
    </div>
    <h1 style="font-size:1.5rem;margin-bottom:0.5rem">Payment Successful!</h1>
    <p style="color:var(--text-secondary);margin-bottom:2rem">You've been enrolled in <strong>{{ course.title }}</strong>. Start learning now!</p>
    <a href="{% url 'courses:detail' slug=course.slug %}" class="btn-accent" style="padding:0.7rem 2rem"><i class="fas fa-play me-1"></i> Go to Course</a>
    <div style="margin-top:1rem">
        <a href="{% url 'payments:history' %}" style="font-size:0.85rem;color:var(--text-muted)">View payment history</a>
    </div>
</div>
{% endblock %}
