<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="170" height="170">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="40%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a84e"/>
      <stop offset="100%" stop-color="#e8d48a"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal shield -->
  <path d="M85 8 L155 45 L155 125 L85 162 L15 125 L15 45 Z" fill="url(#mainGrad)"/>
  <path d="M85 20 L145 52 L145 118 L85 150 L25 118 L25 52 Z" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35"/>

  <!-- Neural net nodes layer 1 -->
  <circle cx="48" cy="62" r="7.5" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="48" cy="88" r="7.5" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="48" cy="114" r="7.5" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Neural net nodes layer 2 -->
  <circle cx="85" cy="52" r="8.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="85" cy="80" r="8.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="85" cy="108" r="8.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="85" cy="132" r="7" fill="#ffffff" opacity="0.6"/>

  <!-- Neural net nodes layer 3 -->
  <circle cx="122" cy="70" r="8" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="122" cy="100" r="8" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Connections 1→2 -->
  <line x1="55" y1="62" x2="77" y2="52" stroke="#c8a84e" stroke-width="1.5" opacity="0.45"/>
  <line x1="55" y1="62" x2="77" y2="80" stroke="#c8a84e" stroke-width="1.5" opacity="0.35"/>
  <line x1="55" y1="88" x2="77" y2="80" stroke="#c8a84e" stroke-width="1.5" opacity="0.45"/>
  <line x1="55" y1="88" x2="77" y2="108" stroke="#c8a84e" stroke-width="1.5" opacity="0.35"/>
  <line x1="55" y1="114" x2="77" y2="108" stroke="#c8a84e" stroke-width="1.5" opacity="0.45"/>
  <line x1="55" y1="114" x2="77" y2="132" stroke="#c8a84e" stroke-width="1.5" opacity="0.35"/>
  <line x1="55" y1="88" x2="77" y2="52" stroke="#c8a84e" stroke-width="1" opacity="0.2"/>
  <line x1="55" y1="62" x2="77" y2="108" stroke="#c8a84e" stroke-width="1" opacity="0.15"/>
  <line x1="55" y1="114" x2="77" y2="80" stroke="#c8a84e" stroke-width="1" opacity="0.2"/>

  <!-- Connections 2→3 -->
  <line x1="93" y1="52" x2="114" y2="70" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <line x1="93" y1="80" x2="114" y2="70" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <line x1="93" y1="80" x2="114" y2="100" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <line x1="93" y1="108" x2="114" y2="100" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <line x1="93" y1="52" x2="114" y2="100" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <line x1="93" y1="108" x2="114" y2="70" stroke="#fff" stroke-width="1" opacity="0.2"/>
  <line x1="93" y1="132" x2="114" y2="100" stroke="#fff" stroke-width="1.5" opacity="0.35"/>

  <!-- Graduation cap -->
  <g transform="translate(85, 24)">
    <polygon points="0,-14 22,-5 0,5 -22,-5" fill="url(#accentGrad)"/>
    <line x1="0" y1="5" x2="0" y2="14" stroke="#c8a84e" stroke-width="2"/>
    <circle cx="0" cy="16" r="2.5" fill="#c8a84e"/>
    <line x1="22" y1="-5" x2="22" y2="7" stroke="#c8a84e" stroke-width="1.5"/>
    <path d="M-12,2 Q0,10 12,2" fill="none" stroke="#c8a84e" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>
