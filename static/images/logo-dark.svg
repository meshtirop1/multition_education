      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="darkAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a84e"/>
      <stop offset="100%" stop-color="#e8d48a"/>
